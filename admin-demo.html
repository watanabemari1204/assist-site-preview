<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0b38b5;--a:#e8c15a;--line:#dde2de;--bg:#f4f6f4;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font:14px/1.6 "Noto Sans JP",sans-serif;background:var(--bg);color:#1a1a1a}
header{background:var(--g);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:5}
header b{color:var(--a);letter-spacing:.1em}header a{color:#cfe3d8;margin-left:auto;font-size:12px}
nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 24px;position:sticky;top:56px;z-index:4}
nav button{border:0;background:none;padding:14px 18px;font:inherit;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;color:#555}
nav button.on{color:var(--g);border-color:var(--g)}
main{max-width:1180px;margin:0 auto;padding:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:18px}
h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:18px 0 8px}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:#667;text-align:left;font-weight:500;padding:4px}td{padding:3px}
input,select,textarea{font:inherit;padding:7px 8px;border:1px solid #ccd3ce;border-radius:4px;width:100%;background:#fff}
input[type=number]{width:62px;padding:7px 4px;text-align:center}input[type=checkbox]{width:auto}
.btn{border:0;background:var(--g);color:#fff;padding:9px 18px;border-radius:4px;font:inherit;font-weight:700;cursor:pointer}
.btn.sub{background:#fff;color:var(--g);border:1px solid var(--g)}.btn.del{background:#fff;color:var(--red);border:1px solid var(--red);padding:5px 10px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:6px;opacity:0;transition:.3s;z-index:9;max-width:90vw}
.toast.on{opacity:1}.toast.err{background:var(--red)}
.gl{display:grid;grid-template-columns:110px 1fr 90px 90px auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.note{color:#667;font-size:12px}.tw{overflow-x:auto}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:4px;background:#e8ece9;vertical-align:middle}
</style></head><body>

 const list=(key,rowFn,add,label)=>`<h3>${label}</h3>${t[key].map((r,i)=>`<div class="row" style="margin-bottom:8px">${rowFn(r,i)}<button class="btn del" onclick="D.tryout.${key}.splice(${i},1);draw()">削除</button></div>`).join("")||'<p class="note">まだありません。</p>'}<button class="btn sub" onclick="D.tryout.${key}.unshift(${add});draw()">＋ 追加</button>`;
 return `<div class="card"><h2>トライアウトページ（<a href="tryout.html" target="_blank">ページを見る ↗</a>）</h2><p class="note">ここを書き換えると、トライアウトのページにすぐ反映されます。「調整中」のままの項目は、ページにもそのまま表示されます。</p>
 <h3>基本情報</h3><div class="row"><label><span class="note">開催日</span><input type="date" value="${t.date}" onchange="D.tryout.date=this.value"></label><div style="flex:1;min-width:200px">${F("time","時間","例：9:00〜15:00")}</div><div style="flex:1;min-width:200px">${F("venue","会場","例：○○球場")}</div></div>
 <div class="row">${[["fee","参加費"],["target","対象"],["age","年齢"],["area","活動エリア"],["deadline","申込締切"],["content","内容"]].map(([k,l])=>`<div style="flex:1;min-width:200px">${F(k,l)}</div>`).join("")}</div>
 <div style="margin-top:8px">${F("form_url","申込フォーム（GoogleフォームのURL・貼るとエントリーボタンとフォームがページに出ます）","https://forms.gle/…")}</div><div style="margin-top:8px">${F("form_src_entry","フォームの「どこで知りましたか」の質問ID（流入元を自動で引き継ぐ設定・例：entry.1234567890／設計書を参照）","entry.1234567890")}</div><div style="margin-top:8px">${F("ga_id","Googleアナリティクス4の測定ID（任意・公開版の閲覧数を数えます。G-XXXXXXXXXX）","G-XXXXXXXXXX")}</div><div style="margin-top:8px">${F("line_url","LINEのURL（任意・入れるとページにLINEボタンが出ます。https://〜）")}</div>
 ${list("youtube",(r,i)=>`<input style="flex:1;min-width:260px" value="${esc(r.url)}" placeholder="YouTubeのURL（https://youtu.be/… または watch?v=…）" onchange="D.tryout.youtube[${i}].url=this.value"><input style="width:240px" value="${esc(r.title)}" placeholder="動画のタイトル（任意）" onchange="D.tryout.youtube[${i}].title=this.value">`,'{title:"",url:""}',"YouTube動画（URLを貼るだけ・ページの「MOVIE」に出ます）")}
 ${list("news",(r,i)=>`<input style="width:120px" value="${esc(r.d)}" placeholder="2026.10.13" onchange="D.tryout.news[${i}].d=this.value"><input style="flex:1;min-width:220px" value="${esc(r.t)}" placeholder="見出し" onchange="D.tryout.news[${i}].t=this.value"><textarea rows="2" style="flex:2;min-width:260px" placeholder="本文（任意）" onchange="D.tryout.news[${i}].b=this.value">${esc(r.b)}</textarea>`,'{d:new Date().toISOString().slice(0,10).replace(/-/g,"."),t:"",b:""}',"お知らせ（ページの「NEWS」に出ます・上が新しい）")}
 ${list("schedule",(r,i)=>`<input style="width:160px" value="${esc(r.t)}" placeholder="時間（例：9:00）" onchange="D.tryout.schedule[${i}].t=this.value"><input style="flex:1;min-width:220px" value="${esc(r.x)}" placeholder="内容（例：受付）" onchange="D.tryout.schedule[${i}].x=this.value">`,'{t:"",x:""}',"当日の流れ")}
 ${list("faq",(r,i)=>`<input style="flex:1;min-width:200px" value="${esc(r.q)}" placeholder="質問" onchange="D.tryout.faq[${i}].q=this.value"><textarea rows="2" style="flex:2;min-width:260px" placeholder="答え" onchange="D.tryout.faq[${i}].a=this.value">${esc(r.a)}</textarea>`,'{q:"",a:""}',"よくある質問")}
 <h3>参加特典（1行に1つ・空なら表示しません）</h3><textarea rows="3" onchange="D.tryout.perks=this.value.split('\n').map(s=>s.trim()).filter(Boolean)">${esc((t.perks||[]).join("\n"))}</textarea>
 <h3>代表メッセージ（空なら表示しません）</h3><div class="row"><input style="width:220px" value="${esc(t.message_name)}" placeholder="名前・肩書き" onchange="D.tryout.message_name=this.value"></div><textarea rows="4" style="margin-top:8px" onchange="D.tryout.message=this.value">${esc(t.message)}</textarea>
 <div class="row" style="margin-top:20px"><button class="btn" onclick="saveTryout()">変更を保存する</button></div></div>`}
async function saveTryout(){const t={...D.tryout};delete t._ui;try{await api("tryout","PUT",t);toast("保存しました。トライアウトのページに反映済みです");D.tryout._ui=0;load()}catch(e){toast(e.message,1)}}

/* ---------- アクセス集計・流入元 ---------- */
async function openStats(){try{H=await api("hits")}catch(e){H={};toast(e.message,1)}draw()}
function statsView(){const t=D.tryout;t.sources=t.sources||[];t.apps=t.apps||{};
 const days=Object.keys(H).sort().reverse();const sum=(f)=>days.filter(f).reduce((a,d)=>{for(const[k,v]of Object.entries(H[d]))a[k]=(a[k]||0)+v;return a},{});
 const d7=new Date(Date.now()-6*864e5).toISOString().slice(0,10);const all=sum(()=>1),w=sum(d=>d>=d7);
 const keys=[...t.sources.map(s=>s.key),"direct"];Object.keys(all).forEach(k=>{if(!keys.includes(k))keys.push(k)});
 const base=(t.site_url||location.origin).replace(/\/$/,"");const tot=Object.values(all).reduce((a,b)=>a+b,0);
 const apps=Object.values(t.apps).reduce((a,b)=>a+(+b||0),0),goal=+t.goal||0,pct=goal?Math.min(100,Math.round(apps/goal*100)):0;
 const lab=k=>k==="direct"?"直接・目印なし":(t.sources.find(s=>s.key===k)?.label||"");
 return `<div class="card"><h2>人数の状況</h2><div class="row"><div style="flex:1;min-width:220px"><div class="note">申込数（下の欄の合計）／目標人数</div><div style="font-size:30px;font-weight:700">${apps} <span style="font-size:16px;color:#667">／ ${goal||"未設定"}人</span></div>${goal?`<div style="height:12px;background:#e3e8f6;border-radius:6px;margin-top:6px"><div style="height:12px;width:${pct}%;background:var(--g);border-radius:6px"></div></div><div class="note">${pct}％</div>`:""}</div>
 <label><span class="note">目標人数</span><input type="number" style="width:110px" value="${goal}" onchange="D.tryout.goal=+this.value;draw()"></label>
 <div style="flex:1;min-width:260px"><label style="display:block"><span class="note">サイトの公開URL（リンクの作成に使います）</span><input value="${esc(t.site_url)}" placeholder="https://example.com" onchange="D.tryout.site_url=this.value.trim();draw()"></label></div></div>
 <p class="note">申込数は、Googleフォームのスプレッドシートの人数（流入元ごと）を、下の欄に入れてください。閲覧数は自動で数えます。</p></div>
 <div class="card"><h2>流入元ごとの閲覧数と申込率（閲覧 合計 ${tot}）</h2><div class="tw"><table><tr><th>流入元</th><th>目印</th><th>閲覧数（累計）</th><th>直近7日</th><th>申込数</th><th>申込率</th><th>リンク</th><th></th></tr>
 ${keys.map(k=>{const v=all[k]||0,a=+t.apps[k]||0;const src=t.sources.findIndex(s=>s.key===k);
  return `<tr style="border-top:1px solid var(--line)"><td>${src>=0?`<input value="${esc(t.sources[src].label)}" placeholder="例：〇〇さんの動画" onchange="D.tryout.sources[${src}].label=this.value">`:esc(lab(k))||'<span class="note">（未登録の目印）</span>'}</td><td><code>${esc(k)}</code></td><td><b>${v}</b></td><td>${w[k]||0}</td>
  <td><input type="number" min="0" style="width:80px" value="${a}" onchange="D.tryout.apps['${k}']=+this.value;draw()"></td><td>${v?Math.round(a/v*1000)/10+"％":"-"}</td>
  <td>${k==="direct"?"":`<button class="btn sub" style="padding:5px 10px" onclick="copyLink('${base}/tryout.html?src=${k}')">リンクをコピー</button>`}</td>
  <td>${src>=0?`<button class="btn del" onclick="if(confirm('この流入元を削除しますか？（閲覧数の記録は残ります）')){D.tryout.sources.splice(${src},1);draw()}">削除</button>`:""}</td></tr>`}).join("")}</table></div>
 <div class="row" style="margin-top:14px"><input id="nk" style="width:200px" placeholder="目印（半角英数字 例：youtuberA）"><input id="nl" style="width:240px" placeholder="名前（例：〇〇さんの動画）"><button class="btn sub" onclick="addSource()">＋ 流入元を追加</button><button class="btn" style="margin-left:auto" onclick="saveTryout()">変更を保存する</button></div>
 <p class="note">動画ごとに流入元を作り、「リンクをコピー」したURLを、その動画の概要欄に貼ります。</p></div>
 <div class="card"><h2>日ごとの閲覧数（直近14日）</h2><div class="tw"><table><tr><th>日付</th><th>閲覧数</th><th>内訳</th></tr>${days.slice(0,14).map(d=>`<tr style="border-top:1px solid var(--line)"><td>${d}</td><td><b>${Object.values(H[d]).reduce((a,b)=>a+b,0)}</b></td><td class="note">${Object.entries(H[d]).map(([k,v])=>k+"："+v).join("　")}</td></tr>`).join("")||'<tr><td colspan="3" class="note">まだ閲覧の記録がありません。</td></tr>'}</table></div></div>`}
function addSource(){const k=$("#nk").value.trim(),l=$("#nl").value.trim();if(!/^[A-Za-z0-9_-]{1,30}$/.test(k))return toast("目印は半角英数字（_ - 可）で入れてください",1);
 if(D.tryout.sources.some(s=>s.key===k))return toast("その目印はすでにあります",1);D.tryout.sources.push({key:k,label:l});draw()}
async function copyLink(u){try{await navigator.clipboard.writeText(u);toast("コピーしました："+u)}catch(e){prompt("このURLをコピーしてください",u)}}
load().catch(e=>{$("#m").innerHTML=`<div class="card">読み込めませんでした：${esc(e.message)}</div>`});
</script></body></html>
